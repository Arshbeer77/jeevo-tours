<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeevo Tours CRM - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-new { background: #dbeafe; color: #1e40af; }
        .status-contacted { background: #fef3c7; color: #92400e; }
        .status-itinerary { background: #e0e7ff; color: #4338ca; }
        .status-booked { background: #d1fae5; color: #065f46; }
        .status-lost { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="text-3xl">🕉</span>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Jeevo Tours CRM</h1>
                        <p class="text-sm text-gray-500">Lead Management Dashboard</p>
                    </div>
                </div>
                <button onclick="refreshData()" class="px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition">
                    <i class="fas fa-sync-alt mr-2"></i> Refresh
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-blue-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 font-medium">Total Leads</p>
                        <p class="text-3xl font-bold text-gray-900" id="stat-total">0</p>
                    </div>
                    <i class="fas fa-users text-blue-500 text-3xl"></i>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-yellow-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 font-medium">New Leads</p>
                        <p class="text-3xl font-bold text-gray-900" id="stat-new">0</p>
                    </div>
                    <i class="fas fa-bell text-yellow-500 text-3xl"></i>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-green-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 font-medium">Booked</p>
                        <p class="text-3xl font-bold text-gray-900" id="stat-booked">0</p>
                    </div>
                    <i class="fas fa-check-circle text-green-500 text-3xl"></i>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-purple-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 font-medium">Conversion</p>
                        <p class="text-3xl font-bold text-gray-900" id="stat-conversion">0%</p>
                    </div>
                    <i class="fas fa-chart-line text-purple-500 text-3xl"></i>
                </div>
            </div>
        </div>

        <!-- Leads Table -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">All Leads</h2>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Client</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Destination</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Budget</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leads-table-body" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="7" class="px-6 py-8 text-center text-gray-500">
                                <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                                <p>Loading leads...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Update Lead Modal -->
    <div id="updateModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-900">Update Lead</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6 space-y-6">
                <!-- Lead Details -->
                <div class="bg-gray-50 rounded-lg p-4">
                    <h4 class="font-semibold text-gray-900 mb-2" id="modal-client-name">-</h4>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div>
                            <span class="text-gray-600">Email:</span>
                            <span class="text-gray-900 font-medium ml-2" id="modal-email">-</span>
                        </div>
                        <div>
                            <span class="text-gray-600">Phone:</span>
                            <span class="text-gray-900 font-medium ml-2" id="modal-phone">-</span>
                        </div>
                        <div>
                            <span class="text-gray-600">Destination:</span>
                            <span class="text-gray-900 font-medium ml-2" id="modal-destination">-</span>
                        </div>
                        <div>
                            <span class="text-gray-600">Budget:</span>
                            <span class="text-gray-900 font-medium ml-2" id="modal-budget">-</span>
                        </div>
                    </div>
                </div>

                <!-- Update Status -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-flag mr-1"></i> Update Status
                    </label>
                    <select id="modal-status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent">
                        <option value="New Lead">New Lead</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Itinerary Sent">Itinerary Sent</option>
                        <option value="Booked">Booked</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>

                <!-- Existing Notes -->
                <div id="existing-notes-section" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-history mr-1"></i> Previous Notes
                    </label>
                    <div class="bg-gray-50 rounded-lg p-4 max-h-40 overflow-y-auto">
                        <p class="text-sm text-gray-700 whitespace-pre-wrap" id="modal-existing-notes">No notes yet</p>
                    </div>
                </div>

                <!-- Add New Note -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-sticky-note mr-1"></i> Add New Note
                    </label>
                    <textarea
                        id="modal-new-note"
                        rows="4"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                        placeholder="Enter follow-up notes, customer feedback, or next steps..."
                    ></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="flex space-x-3">
                    <button
                        onclick="saveLeadUpdate()"
                        class="flex-1 px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition font-medium">
                        <i class="fas fa-save mr-2"></i> Save Changes
                    </button>
                    <button
                        onclick="closeModal()"
                        class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition font-medium">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Base URL - Update this for production deployment
        const API_BASE_URL = window.location.origin;

        let currentLeadId = null;

        // ============================================
        // LOAD DATA ON PAGE LOAD
        // ============================================

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadLeads();
        });

        async function refreshData() {
            await Promise.all([loadStats(), loadLeads()]);
        }

        // ============================================
        // LOAD STATS
        // ============================================

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/crm/stats`);
                const stats = await response.json();

                document.getElementById('stat-total').textContent = stats.total_leads;
                document.getElementById('stat-new').textContent = stats.new_leads;
                document.getElementById('stat-booked').textContent = stats.booked;
                document.getElementById('stat-conversion').textContent = `${stats.conversion_rate}%`;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // ============================================
        // LOAD LEADS TABLE
        // ============================================

        async function loadLeads() {
            const tableBody = document.getElementById('leads-table-body');

            try {
                const response = await fetch(`${API_BASE_URL}/api/crm/leads`);
                const leads = await response.json();

                if (leads.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="7" class="px-6 py-8 text-center text-gray-500">
                                <i class="fas fa-inbox text-4xl mb-2"></i>
                                <p class="text-lg font-medium">No leads yet</p>
                                <p class="text-sm">New enquiries will appear here automatically</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tableBody.innerHTML = leads.map(lead => `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${formatDate(lead.created_at)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${escapeHtml(lead.name)}</div>
                            ${lead.travel_dates ? `<div class="text-xs text-gray-500">${escapeHtml(lead.travel_dates)}</div>` : ''}
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">
                            <div><i class="fas fa-envelope text-gray-400 mr-1"></i> ${escapeHtml(lead.email)}</div>
                            <div><i class="fas fa-phone text-gray-400 mr-1"></i> ${escapeHtml(lead.phone)}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                            ${lead.destination || '-'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                            ${lead.budget || '-'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            ${getStatusBadge(lead.status)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                            <button
                                onclick="openUpdateModal(${lead.id})"
                                class="text-blue-600 hover:text-blue-800"
                                title="Update Lead">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button
                                onclick="deleteLead(${lead.id})"
                                class="text-red-600 hover:text-red-800"
                                title="Delete Lead">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error('Failed to load leads:', error);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-8 text-center text-red-500">
                            <i class="fas fa-exclamation-triangle text-2xl mb-2"></i>
                            <p>Failed to load leads. Please refresh the page.</p>
                        </td>
                    </tr>
                `;
            }
        }

        // ============================================
        // OPEN UPDATE MODAL
        // ============================================

        async function openUpdateModal(leadId) {
            currentLeadId = leadId;

            try {
                const response = await fetch(`${API_BASE_URL}/api/crm/leads/${leadId}`);
                const lead = await response.json();

                // Populate modal with lead data
                document.getElementById('modal-client-name').textContent = lead.name;
                document.getElementById('modal-email').textContent = lead.email;
                document.getElementById('modal-phone').textContent = lead.phone;
                document.getElementById('modal-destination').textContent = lead.destination || 'Not specified';
                document.getElementById('modal-budget').textContent = lead.budget || 'Not specified';
                document.getElementById('modal-status').value = lead.status;
                document.getElementById('modal-new-note').value = '';

                // Show existing notes if any
                if (lead.notes && lead.notes.trim()) {
                    document.getElementById('existing-notes-section').classList.remove('hidden');
                    document.getElementById('modal-existing-notes').textContent = lead.notes;
                } else {
                    document.getElementById('existing-notes-section').classList.add('hidden');
                }

                // Show modal
                document.getElementById('updateModal').classList.remove('hidden');

            } catch (error) {
                console.error('Failed to load lead details:', error);
                alert('Failed to load lead details. Please try again.');
            }
        }

        // ============================================
        // CLOSE MODAL
        // ============================================

        function closeModal() {
            document.getElementById('updateModal').classList.add('hidden');
            currentLeadId = null;
        }

        // ============================================
        // SAVE LEAD UPDATE
        // ============================================

        async function saveLeadUpdate() {
            if (!currentLeadId) return;

            const status = document.getElementById('modal-status').value;
            const newNote = document.getElementById('modal-new-note').value.trim();

            try {
                const response = await fetch(`${API_BASE_URL}/api/crm/leads/${currentLeadId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        status: status,
                        notes: newNote || undefined
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to update lead');
                }

                // Success!
                closeModal();
                await refreshData();

                // Show success message (simple alert - you can make this fancier)
                showNotification('Lead updated successfully!', 'success');

            } catch (error) {
                console.error('Failed to update lead:', error);
                alert('Failed to update lead. Please try again.');
            }
        }

        // ============================================
        // DELETE LEAD
        // ============================================

        async function deleteLead(leadId) {
            if (!confirm('Are you sure you want to delete this lead? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/crm/leads/${leadId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete lead');
                }

                await refreshData();
                showNotification('Lead deleted successfully', 'success');

            } catch (error) {
                console.error('Failed to delete lead:', error);
                alert('Failed to delete lead. Please try again.');
            }
        }

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        function getStatusBadge(status) {
            const statusMap = {
                'New Lead': 'status-new',
                'Contacted': 'status-contacted',
                'Itinerary Sent': 'status-itinerary',
                'Booked': 'status-booked',
                'Lost': 'status-lost'
            };

            const className = statusMap[status] || 'status-new';
            return `<span class="status-badge ${className}">${status}</span>`;
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showNotification(message, type = 'success') {
            // Simple notification - you can enhance this
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-opacity duration-300`;
            notification.innerHTML = `
                <i class="fas fa-check-circle mr-2"></i>
                ${message}
            `;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Close modal on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>

</body>
</html>
